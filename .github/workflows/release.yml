name: Release

# Runs on every push to main. semantic-release analyzes conventional commits
# since the last tag; if none are releasable (no feat/fix/BREAKING), it exits
# cleanly without publishing. Does NOT commit anything back to the repo.
on:
  push:
    branches: [main]

# Serialize releases so two pushes can't race the npm publish + tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + GitHub Release
      issues: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history for tag analysis

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing requires npm >= 11.5.1; Node 22 ships with npm 10.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # No NPM_TOKEN: npm exchanges the OIDC id-token (id-token: write above)
      # with the registry for a short-lived publish token. Provenance is implicit.
      - run: npx --yes semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
